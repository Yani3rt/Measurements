<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Atelier favicon</title>
  <desc id="desc">A deep navy atelier monogram with a muted gold measuring arc and teal stitch mark.</desc>
  <defs>
    <linearGradient id="navy" x1="96" x2="416" y1="48" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03192e"/>
      <stop offset="1" stop-color="#1a2e44"/>
    </linearGradient>
    <linearGradient id="paper" x1="160" x2="352" y1="116" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#fddc98"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#03192e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="#fafaf5"/>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="url(#navy)" filter="url(#soft-shadow)"/>

  <path d="M128 332c38-96 84-144 128-144s90 48 128 144" fill="none" stroke="#735b24" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <path d="M154 331h204" fill="none" stroke="#fddc98" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#fddc98" stroke-linecap="round" opacity="0.92">
    <path d="M174 313v34" stroke-width="8"/>
    <path d="M206 321v20" stroke-width="6"/>
    <path d="M238 313v34" stroke-width="8"/>
    <path d="M274 321v20" stroke-width="6"/>
    <path d="M306 313v34" stroke-width="8"/>
    <path d="M338 321v20" stroke-width="6"/>
  </g>

  <text x="256" y="296" fill="url(#paper)" font-family="Bodoni 72, Didot, Georgia, serif" font-size="210" font-weight="600" text-anchor="middle" letter-spacing="-18">A</text>
  <path d="M331 174c28 26 45 62 45 102" fill="none" stroke="#2e6f73" stroke-width="16" stroke-linecap="round"/>
  <circle cx="376" cy="292" r="13" fill="#d7e8e6"/>
</svg>
